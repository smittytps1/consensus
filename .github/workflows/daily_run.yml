name: MLB Betting Bot Auto-Run

on:
  schedule:
    - cron: '0 14 * * *' # Runs daily at 10:00 AM EDT (14:00 UTC)
  workflow_dispatch:     # Enables the manual "Run workflow" button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Grants permission to push updates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 pandas requests gspread google-genai
          playwright install chromium

      - name: Run MLB Consensus Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python main.py
