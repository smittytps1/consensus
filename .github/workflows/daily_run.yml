name: MLB Consensus Betting Bot Auto-Run

on:
  schedule:
    # Runs daily at 10:00 AM EDT (14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch: # Enables the manual "Run workflow" button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run MLB Consensus Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python bot.py

      - name: Commit and Push bot_memory.json
        run: |
          git config --global user.name 'MLB Bot Automator'
          git config --global user.email 'action@github.com'
          git add bot_memory.json || true
          git commit -m "Automated bot memory update [skip ci]" || echo "No changes to commit"
          git push || true
